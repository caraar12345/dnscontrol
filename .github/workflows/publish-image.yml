name: Publish image

on:
  push:
    branches:
      - claude/technitium-dns-provider-8e3qev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compute branch tag
        id: tag
        run: echo "branch=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fork
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/caraar12345/dnscontrol:sha-${{ github.sha }}
            ghcr.io/caraar12345/dnscontrol:${{ steps.tag.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
